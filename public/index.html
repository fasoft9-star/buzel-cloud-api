<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzel Studio — Storage & Edge API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            sb: {
              bg: '#121212',
              panel: '#171717',
              surface: '#1c1c1c',
              hover: '#242424',
              border: '#2e2e2e',
              borderLight: '#363636',
              brand: '#3ecf8e',
              brandDark: '#24b47e',
              muted: '#898989',
              text: '#ededed',
            }
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ededed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
    }
    .sb-grid-bg {
      background-size: 32px 32px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #3ecf8e; }
  </style>
</head>
<body class="bg-[#121212] text-[#ededed] antialiased selection:bg-[#3ecf8e]/25 selection:text-[#3ecf8e]">
  <div id="root"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
